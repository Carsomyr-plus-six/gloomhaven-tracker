<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloomhaven Campaign</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1 id="title">Gloomhaven Campaign</h1>
    <nav class="tabs" aria-label="Sections">
      <a href="#overview" data-tab="overview">Overview</a>
      <a href="#scenarios" data-tab="scenarios">Scenarios</a>
      <a href="#characters" data-tab="characters">Characters</a>
      <a href="#sessions" data-tab="sessions">Sessions</a>
    </nav>
  </header>

  <main>
    <p id="status" class="status">Loading campaign…</p>
    <section id="overview" class="panel" hidden></section>
    <section id="scenarios" class="panel" hidden></section>
    <section id="characters" class="panel" hidden></section>
    <section id="sessions" class="panel" hidden></section>
  </main>

  <footer class="site-footer" id="footer"></footer>
</body>
</html>
