<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloomhaven Campaign</title>
  <style>
    :root {
      --bg: #f4efe6;
      --fg: #2b2118;
      --muted: #7a6a58;
      --accent: #8b2e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1714;
        --fg: #ece3d6;
        --muted: #a8998a;
        --accent: #d0654e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 6vw, 3rem); color: var(--accent); }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Gloomhaven Campaign</h1>
    <p>Tracker under construction. Scenarios, characters and the party coming soon.</p>
  </main>
</body>
</html>
