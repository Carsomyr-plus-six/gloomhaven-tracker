<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1211">
  <title>Gloomhaven Campaign</title>
  <!-- The brass hexagon from the top bar, for tabs, bookmarks and home screens. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="campaign.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#overview">Skip to content</a>
  <!-- A top bar on wide screens; a thumb-reach tab bar at the bottom on phones. -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#overview">
        <span class="brand-mark" aria-hidden="true"></span>
        <span id="title">Gloomhaven Campaign</span>
      </a>
      <!-- Wide screens: the campaign's sections, one page. Phones: four tabs
           for the table, in the order of an evening: setting up tonight,
           playing (this phone's character), the town after, and the campaign
           itself. -->
      <nav class="tabs" aria-label="Sections">
        <a href="#overview" data-tab="tonight">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.500 14.500A8 8 0 1 1 9.500 4.500a6.500 6.500 0 0 0 10 10z"/></svg>
          <span class="wide-label">Overview</span><span class="phone-label">Tonight</span>
        </a>
        <a href="#characters" data-tab="play">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.200-3.600 4.300-5.500 8-5.500s6.800 1.900 8 5.500"/></svg>
          <span class="wide-label">Characters</span><span class="phone-label">Play</span>
        </a>
        <a href="#shop" data-tab="town">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3.500 11L12 4l8.500 7"/><path d="M6 9v11h12V9"/><path d="M10 20v-5.500h4V20"/></svg>
          <span class="wide-label">Shop</span><span class="phone-label">Town</span>
        </a>
        <a href="#scenarios" class="wide-only"><span>Scenarios</span></a>
        <a href="#sessions" class="wide-only"><span>Sessions</span></a>
        <a href="#events" class="wide-only"><span>Event decks</span></a>
        <a href="#record" class="wide-only"><span>Campaign record</span></a>
        <a href="#campaign" data-tab="campaign" class="phone-only">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 4L3 6.500v13.500l6-2.500 6 2.500 6-2.500V4l-6 2.500L9 4z"/><path d="M9 4v13.500"/><path d="M15 6.500V20"/></svg>
          <span>Campaign</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- On phones only the panels of the current tab show; on wide screens all of
       them do, as one page. data-tab says which tab a panel belongs to: the
       Overview shows on two, its parts each saying which (app.js). -->
  <main>
    <p id="status" class="status">Loading campaign…</p>
    <section id="overview" class="panel" data-tab="tonight campaign" hidden></section>
    <section id="characters" class="panel" data-tab="play" hidden></section>
    <section id="shop" class="panel" data-tab="town" hidden></section>
    <section id="scenarios" class="panel" data-tab="campaign" hidden></section>
    <!-- Wide screens: Sessions beside Event decks and the Campaign record,
         which fill the column the timeline runs down. -->
    <div class="pair">
      <section id="sessions" class="panel" data-tab="campaign" hidden></section>
      <div class="pair-side">
        <section id="events" class="panel" data-tab="campaign" hidden></section>
        <section id="record" class="panel" data-tab="campaign" hidden></section>
      </div>
    </div>
    <footer class="site-footer" id="footer" data-tab="campaign"></footer>
  </main>
</body>
</html>
